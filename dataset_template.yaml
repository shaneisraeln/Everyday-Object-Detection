# YOLOv8 / YOLO11 Dataset Configuration for Everyday Objects
# Replace 'path' with the absolute or relative path to your dataset folder.

path: ./dataset  # Dataset root directory
train: images/train  # Train images relative to 'path'
val: images/val      # Validation images relative to 'path'
test: images/test    # Optional test images relative to 'path'

# Classes: Everyday household, desk, and personal items
